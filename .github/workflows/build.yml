name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.AMIRI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "AMIRI_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release will be signed with your keystore."
          else
            echo "No keystore secret: release APK will be signed with the debug key (fine for personal installs)."
          fi

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee build-log.txt || {
            grep -E "^e: |error:|FAILED|What went wrong" -A2 build-log.txt | head -120 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            exit 1
          }

      - name: Build debug + release APKs
        env:
          AMIRI_KEYSTORE_PASSWORD: ${{ secrets.AMIRI_KEYSTORE_PASSWORD }}
          AMIRI_KEY_ALIAS: ${{ secrets.AMIRI_KEY_ALIAS }}
          AMIRI_KEY_PASSWORD: ${{ secrets.AMIRI_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug assembleRelease 2>&1 | tee build-log2.txt || {
            grep -E "^e: |error:|FAILED|What went wrong" -A2 build-log2.txt | head -120 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            exit 1
          }

      - name: Verify no network permission
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          if $AAPT dump permissions app/build/outputs/apk/release/*.apk | grep -q "android.permission.INTERNET"; then
            echo "INTERNET permission found — offline guarantee broken"; exit 1
          fi
          echo "OK: no INTERNET permission in release APK"

      - uses: actions/upload-artifact@v4
        with:
          name: AmiriCut-release-apk
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AmiriCut-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK as GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}-build${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "AmiriCut-${VERSION}.apk"
          gh release create "$TAG" "AmiriCut-${VERSION}.apk" \
            --title "Amiri Cut ${VERSION} (build ${{ github.run_number }})" \
            --notes "Automatic build from ${{ github.sha }}. Install AmiriCut-${VERSION}.apk on your phone." \
            --latest

  device-smoke:
    # Runs the real release APK on an emulator and exports a test project end to end.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AmiriCut-release-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/smoke.sh

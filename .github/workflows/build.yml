name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.AMIRI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "AMIRI_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release will be signed with your keystore."
          else
            echo "No keystore secret: release APK will be signed with the debug key (fine for personal installs)."
          fi

      - name: Fetch on-device models (bundled into the APK; the app itself stays offline)
        run: |
          mkdir -p app/src/main/assets/models
          curl -fsSL -o app/src/main/assets/models/selfie_segmenter.tflite \
            https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite \
            && ls -la app/src/main/assets/models || echo "::warning::segmentation model download failed — auto cut-out disabled in this build"

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee build-log.txt || {
            grep -E "^e: |error:|FAILED|What went wrong" -A2 build-log.txt | head -120 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            exit 1
          }

      - name: Build debug + release APKs
        env:
          AMIRI_KEYSTORE_PASSWORD: ${{ secrets.AMIRI_KEYSTORE_PASSWORD }}
          AMIRI_KEY_ALIAS: ${{ secrets.AMIRI_KEY_ALIAS }}
          AMIRI_KEY_PASSWORD: ${{ secrets.AMIRI_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug assembleRelease 2>&1 | tee build-log2.txt || {
            grep -E "^e: |error:|FAILED|What went wrong" -A2 build-log2.txt | head -120 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            exit 1
          }

      - name: Verify no network permission
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          if $AAPT dump permissions app/build/outputs/apk/release/*.apk | grep -q "android.permission.INTERNET"; then
            echo "INTERNET permission found — offline guarantee broken"; exit 1
          fi
          echo "OK: no INTERNET permission in release APK"

      - uses: actions/upload-artifact@v4
        with:
          name: AmiriCut-release-apk
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AmiriCut-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK as GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}-build${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "AmiriCut-${VERSION}.apk"
          gh release create "$TAG" "AmiriCut-${VERSION}.apk" \
            --title "Amiri Cut ${VERSION} (build ${{ github.run_number }})" \
            --notes "Automatic build from ${{ github.sha }}. Install AmiriCut-${VERSION}.apk on your phone." \
            --latest

  device-smoke:
    # Runs the real release APK on an emulator and exports a test project end to end.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AmiriCut-release-apk
          path: apk
      - name: Generate demo media for UI screenshots
        run: |
          pip install --quiet imageio-ffmpeg pillow numpy
          python3 .github/scripts/make_demo_media.py demo-media
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/smoke.sh
      - name: Attach UI screenshots to the release
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls ui-shots/*.png >/dev/null 2>&1 || { echo "::warning::no UI screenshots"; exit 0; }
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import glob, os
          files = sorted(glob.glob("ui-shots/*.png"))
          ims = []
          for f in files:
              try:
                  im = Image.open(f).convert("RGB")
              except Exception:
                  continue
              im = im.resize((360, int(im.height * 360 / im.width)))
              ims.append((os.path.basename(f)[:-4], im))
          cols = 5
          h = max(i.height for _, i in ims) + 30
          sheet = Image.new("RGB", (cols * 370, ((len(ims) + cols - 1) // cols) * h), (24, 24, 28))
          d = ImageDraw.Draw(sheet)
          for k, (n, im) in enumerate(ims):
              x, y = (k % cols) * 370, (k // cols) * h
              sheet.paste(im, (x, y + 26)); d.text((x + 6, y + 6), n, fill=(230, 230, 230))
          sheet.save("ui-shots.png")
          PY
          zip -qj ui-shots.zip ui-shots/*.png
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}-build${{ github.run_number }}"
          gh release upload "$TAG" ui-shots.png ui-shots.zip --clobber || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots
          path: ui-shots/
      - name: Attach preview frames of the self-test export to the release
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la selftest-out.mp4 || { echo "::warning::no selftest-out.mp4 in $(pwd): $(ls | tr '\n' ' ')"; exit 0; }
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}-build${{ github.run_number }}"
          pip install --quiet imageio-ffmpeg
          FF=$(python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          "$FF" -hide_banner -loglevel error -y -i selftest-out.mp4 -vf "fps=2,scale=180:-1,tile=6x2" -frames:v 1 selftest-frames.png
          gh release upload "$TAG" selftest-frames.png --clobber || true

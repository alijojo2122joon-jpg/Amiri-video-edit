name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.AMIRI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "AMIRI_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release will be signed with your keystore."
          else
            echo "No keystore secret: release APK will be signed with the debug key (fine for personal installs)."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug + release APKs
        env:
          AMIRI_KEYSTORE_PASSWORD: ${{ secrets.AMIRI_KEYSTORE_PASSWORD }}
          AMIRI_KEY_ALIAS: ${{ secrets.AMIRI_KEY_ALIAS }}
          AMIRI_KEY_PASSWORD: ${{ secrets.AMIRI_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Verify no network permission
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          if $AAPT dump permissions app/build/outputs/apk/release/*.apk | grep -q "android.permission.INTERNET"; then
            echo "INTERNET permission found — offline guarantee broken"; exit 1
          fi
          echo "OK: no INTERNET permission in release APK"

      - uses: actions/upload-artifact@v4
        with:
          name: AmiriCut-release-apk
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AmiriCut-debug-apk
          path: app/build/outputs/apk/debug/*.apk
